[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atsc3lib"
version = "0.1.0"
description = "ATSC 3.0 Physical Layer Demodulation Library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenATSC3", email = "openatsc3@example.com"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
rtl = [
    "pyrtlsdr>=0.2.90",
]
hackrf = [
    "hackrf>=0.1",
]
sdr = [
    "pyrtlsdr>=0.2.90",
    "hackrf>=0.1",
]

[project.scripts]
atsc3-decode = "atsc3lib.cli:decode_main"
atsc3-capture = "atsc3lib.capture:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atsc3lib*"]

[tool.setuptools.package-data]
atsc3lib = ["data/*.json", "data/*.npz"]
